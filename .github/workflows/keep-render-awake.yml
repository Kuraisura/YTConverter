name: Keep Render service awake

on:
  schedule:
    # Five minutes leaves room for delayed GitHub scheduling before Render's
    # 15-minute idle window expires.
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/keep-render-awake.yml"
      - "app/api/health/live/route.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake Render and wait for the real application
        shell: bash
        run: |
          for attempt in {1..18}; do
            body="$(curl --fail --silent --show-error --max-time 20 \
              https://ytconverter-vt6g.onrender.com/api/health/live || true)"
            if printf '%s' "$body" | grep --quiet '"status":"ok"'; then
              echo "Render application is awake."
              exit 0
            fi
            echo "Render is still starting (attempt ${attempt}/18)."
            sleep 10
          done
          echo "Render did not become healthy within three minutes."
          exit 1
